apiVersion: apps/v1
kind: Deployment

metadata:
  name: securebank
  namespace: securebank

spec:
  replicas: 2

  selector:
    matchLabels:
      app: securebank

  template:
    metadata:
      labels:
        app: securebank

    spec:
      containers:
      - name: securebank

        image: devopsbyrushi/securebank:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"